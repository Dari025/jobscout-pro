name: Validate Python

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

# Single validation gate: it replaces the older `tests.yml`, which ran the same
# pytest command on 3.11 without the syntax/CLI/simulation checks. Covering both
# supported interpreters here keeps one workflow authoritative.
jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Compile every Python module
        run: python -m compileall -q app.py notificar_top.py jobscout_links.py src/job_scout scripts
      - name: Check the CLI entry point imports
        run: PYTHONPATH=src python -m job_scout.cli --help
      - name: Run the test suite
        run: python -m pytest -q
      - name: Run the ranking simulation
        run: python scripts/simulate_ranking.py

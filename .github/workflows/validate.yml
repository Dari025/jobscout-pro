name: Validate Python

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py notificar_top.py jobscout_links.py src/job_scout scripts
      - run: PYTHONPATH=src python -m job_scout.cli --help
      - run: python -m pytest -q
      - run: python scripts/simulate_ranking.py

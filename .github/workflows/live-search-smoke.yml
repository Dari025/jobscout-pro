name: Live search source smoke test

on:
  push:
    branches: [main]
    paths:
      - "src/job_scout/scrapers/freehire.py"
      - "src/job_scout/scrapers/arbeitnow.py"
      - "src/job_scout/cli.py"
      - "src/job_scout/db.py"
      - "src/job_scout/config.py"
      - "busqueda.example.yaml"
      - "scripts/smoke_cli_end_to_end.py"
      - "jobscout_links.py"
      - "scripts/smoke_search_sources.py"
      - ".github/workflows/live-search-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: pip install -r requirements.txt
      # These steps fail the job on purpose: detecting a broken public source is
      # the whole point of this workflow. It is not part of the pull-request
      # gate (it only runs on `main` pushes touching search code, or manually),
      # so a red run is an alert to investigate, not a blocker.
      - name: Probe live public search APIs and exact posting URLs
        run: python scripts/smoke_search_sources.py
      - name: Run the real CLI and verify dashboard SQLite reader sees saved jobs
        run: python scripts/smoke_cli_end_to_end.py
